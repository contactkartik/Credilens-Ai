server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are limited to 10 MB by the backend; leave a little headroom
    client_max_body_size 12m;

    # Forward API calls to the backend container (same job as the Vite
    # dev-server proxy in vite.config.js).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OCR + model inference can be slow (client timeout is 60 s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
